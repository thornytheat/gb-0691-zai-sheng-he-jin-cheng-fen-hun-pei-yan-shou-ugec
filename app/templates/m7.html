{% extends 'base.html' %}
{% block stage_visual %}
<div class="reblend" data-run-id="{{ run.manifest.run_id }}">
  <div class="stamp" id="plan-summary">载入整组补料方案…</div>
  <div id="plan-feedback" role="status" class="alert"></div>
  <div class="controls">
    <button id="plan-load" class="primary">刷新整组方案</button>
    <button id="plan-confirm">确认方案并扣减共用库存</button>
    <button id="plan-demo">载入多炉次演示数据</button>
  </div>
  <div id="plan-status" class="muted small"></div>
</div>
{% endblock %}
{% block scripts %}<script defer src="/static/reblend.js"></script>{% endblock %}
